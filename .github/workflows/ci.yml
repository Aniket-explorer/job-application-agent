name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/
      - name: Scan full git history
        run: gitleaks git . --config .gitleaks.toml --redact --verbose --no-banner

  backend-unit:
    name: Backend lint + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest tests/unit -q

  frontend:
    name: Frontend typecheck + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-integration:
    name: Backend integration tests + coverage gate
    needs: [backend-unit]
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      MONGODB_URL: mongodb://localhost:27017
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      CELERY_RESULT_BACKEND: redis://localhost:6379/2
      REQUIRE_INTEGRATION: "1"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Unit + integration tests with coverage gate
        run: pytest tests/unit tests/integration -q --cov=app --cov-report=term-missing --cov-fail-under=70

  docker-build:
    name: Docker images build + compose validation
    needs: [backend-unit, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: GHCR_OWNER=ci docker compose -f docker-compose.release.yml config --quiet
      - run: docker build -t job-agent-api:ci backend
      - run: docker build -t job-agent-frontend:ci frontend

  smoke:
    name: Stack smoke test (docker compose)
    needs: [backend-integration, docker-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose up -d --build api worker mongo redis
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Run smoke tests against the running stack
        working-directory: backend
        env:
          SMOKE_BASE_URL: http://localhost:8000
        run: pytest tests/smoke -q
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down -v

  e2e:
    name: End-to-end UI tests (Playwright)
    needs: [smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Placeholder until Phase 6
        run: echo "Playwright e2e suite is added in Phase 6 when the dashboard pages exist."
